name = "firewall-policy-compiler"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''Restoring this policy push is the work of a network security or infrastructure engineer picking up after a botched configuration migration, and it is a dependent chain rather than a single repair. All of the data is synthetic: the rule ids, object groups, prefixes and the change-advisory minutes were generated for this task and describe no real network, device or person. The migration left /app/data/policy_rules.json holding a truncated prefix of the rule base, so the first step is to rebuild it by replaying the configuration journal onto the pre-migration snapshot under the board's final recovery decision -- each change keyed on the rule it names, an amendment overwriting a field in place, a retraction taking a rule out while the migrator keeps it as it then stood, and a restoration returning exactly that held state so an amendment posted while the rule was out is lost -- and then resolving both sides of every surviving rule through the object-group catalogue, which nests groups inside other groups, carries members naming groups that do not exist, and contains a pair of groups that reference each other, so a resolver that recurses without marking what it has already entered does not terminate. What each side resolves to decides which rules can match at all, so every compilation decision rests on it. Only then can the compiler's dialect be reconstructed, and the minute book is written the way a change advisory board actually writes: it records where the board departed from the intuitive reading and never restates what a prefix, a port range or an object group means. Three February drafts were reversed in the May controls review and two March interims were revised, so every rule must be traced to its FINAL dated decision: the FIRST matching rule in sequence governs rather than the most specific one, a shadowed rule is reported and left in place rather than removed as redundant, a rule whose group resolves to no address is inert rather than an unrestricted wildcard, and the closing deny is emitted explicitly rather than left implied. Those four interact: what is inert decides which rules are live, the live rules decide what can shadow what, the shadowing verdict is a field on a rule that stays in the policy rather than a reason to drop it, and the cap then decides which rules survive -- so a wrong rule anywhere changes not merely a flag but which rules are installed on the device at all. The containment test itself is set-valued on both sides and must hold across protocol, source, destination and ports together, which a per-prefix or per-dimension check quietly gets wrong.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/resolve_rules.go, which implements the board's final recovery decisions (#NET-9170, #NET-9174 and #NET-9178): it starts from /app/data/rule_snapshot_pre_migration.json, replays /app/data/config_journal.json in ascending seq keyed on rule id, applies an amendment in place, holds a retracted rule aside as it then stood, returns exactly that held state on a restoration, ignores a change naming an unknown rule, then resolves each rule's source and destination through /app/data/object_groups.json -- expanding a member that names another group transitively, entering each group at most once per resolution so the catalogue's mutual reference terminates, ignoring a member naming a group that does not exist, and emitting the deduplicated set ordered by network address then prefix length -- and writes the survivors over the truncated /app/data/policy_rules.json ascending by sequence then rule id. Step two copies solution/compile_policy_fixed.go over /app/workflow/compile_policy.go and runs it. The compiler drops a disabled rule and a rule either side of which resolves empty as inert without letting it shadow anything (#NET-9190), clamps port ranges to the policy ceiling before any coverage test (#NET-9192), marks a rule shadowed where a single earlier live rule within the lookback window covers it across protocol, both address sets and the port range (#NET-9186), leaves that rule in the policy in sequence because the device takes the first match (#NET-9182), caps the operator's own rules at max_rules and queues the remainder (#NET-9198, #NET-9196), and closes the policy with an explicit FW-DEFAULT deny that never counts against the cap (#NET-9194).'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the rebuilt rule base must match the sealed digest and rule count, carry only the nine declared fields with no migrator bookkeeping surviving, hold every resolved side deduplicated, masked and ordered, and leave the snapshot, journal, group catalogue and policy byte-identical. The verifier independently re-resolves the object-group catalogue from its own transitive closure and requires the agent's sets to agree, and re-derives the misreadings of the replay from those same sources -- a plain concatenation, a replay in file order rather than by sequence, one where a restoration re-reads the snapshot instead of the held state, and one that expands groups only one level deep -- and requires each to differ from the governed result. Step two recompiles the agent's submitted /app/workflow/compile_policy.go from source with go build rather than trusting any delivered binary, runs it under an unprivileged uid (65534 via setpriv, a scrubbed environment, inputs staged into a candidate-writable work area) on both the recovered rule base and a held-out alternate rule base, and compares summary.json in full plus SHA-256 digests of compiled_policy.json and exception_queue.jsonl against sealed fixtures generated from the reference. Crafted micro-instances pin each reversed rule independently: one proves a rule covered by an earlier rule is flagged shadowed yet stays in the policy, one proves a rule covered only by a LATER rule is not shadowed at all, one proves the union of two earlier rules does not establish shadowing, one proves an empty object group makes a rule inert rather than a wildcard and lets a later rule through unshadowed, one proves containment must hold on protocol, both address sets and ports together, and one proves the closing deny is emitted even once the cap is full and does not consume a place. The run is run without an inner deadline: the contract publishes its ninety-second figure as guidance on the scale a run must handle, and the verifier bounds its own run rather than timing this one. The frozen snapshot /app/workflow/.compile_policy.original.go is asserted present by hash and wrong by output. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1, a fresh environment with no solve.sh gives 0, and so does an environment where the compiler is repaired but the rule base is never rebuilt.'''
relevant_experience = '''Working knowledge of firewall and access-control policy as a discipline -- rule sequence and first-match semantics, prefix containment and CIDR arithmetic, object groups and their nesting, shadowed and redundant rules, implicit deny and policy size limits taken as read rather than looked up -- plus experience rebuilding a device configuration by replaying a migration journal onto a snapshot, resolving a nested object catalogue that contains reference cycles and dangling members, and reconstructing a compiler's dialect from an authoritative but noisy change-advisory minute book that records only its departures from the intuitive reading, tracing incrementally-revised rules to their final form and matching a strict output contract in Go.'''
